<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#ec6a37"/>
      <stop offset="0.55" stop-color="#d94d20"/>
      <stop offset="1" stop-color="#ae3a12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.22" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2e4d6"/>
    </linearGradient>
    <radialGradient id="yolk" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#ffd24a"/>
      <stop offset="1" stop-color="#f09d18"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background for maskable purpose -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" fill="url(#glow)"/>

  <!-- artwork (kept inside the maskable safe zone) -->
  <g transform="translate(256 256) scale(0.92) translate(-256 -256)">

    <!-- steam wisps -->
    <g stroke="#ffffff" stroke-width="15" stroke-linecap="round" fill="none">
      <path d="M 186 208 C 168 184 208 172 190 148 C 174 128 210 118 198 96" opacity="0.92"/>
      <path d="M 244 202 C 226 178 262 166 250 144 C 240 126 270 116 264 96" opacity="0.7"/>
    </g>

    <!-- sparkle -->
    <path d="M 356 78 C 361 102 370 111 396 116 C 370 121 361 130 356 154 C 351 130 342 121 316 116 C 342 111 351 102 356 78 Z" fill="#ffe9a8" opacity="0.95"/>

    <!-- pan handle -->
    <rect x="352" y="298" width="118" height="52" rx="26" fill="#5c3a24"/>
    <circle cx="446" cy="324" r="8" fill="#c74a1d"/>

    <!-- pan body -->
    <circle cx="232" cy="326" r="152" fill="url(#pan)"/>
    <circle cx="232" cy="326" r="128" fill="#f7ecdf"/>

    <!-- fried egg -->
    <g transform="rotate(-10 200 312)">
      <ellipse cx="200" cy="312" rx="80" ry="66" fill="#ffffff"/>
      <ellipse cx="200" cy="312" rx="80" ry="66" fill="none" stroke="#e9dcc9" stroke-width="3"/>
    </g>
    <circle cx="188" cy="306" r="35" fill="url(#yolk)"/>
    <circle cx="177" cy="295" r="9" fill="#ffffff" opacity="0.75"/>

  </g>
</svg>
