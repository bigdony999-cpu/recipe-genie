<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="55%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2542a"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- soft decorations -->
  <g opacity="0.12">
    <text x="90" y="130" font-size="110">🍳</text>
    <text x="1010" y="560" font-size="120">🍝</text>
    <text x="980" y="140" font-size="80">🥑</text>
    <text x="140" y="540" font-size="90">🧀</text>
  </g>

  <!-- headline -->
  <text x="600" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#431407">What&apos;s for dinner?</text>
  <text x="600" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#c2542a">Stop deciding. Start cooking.</text>
  <text x="600" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#9a3412">Pick what&apos;s in your kitchen — get 3–5 simple recipes in seconds.</text>

  <!-- pill -->
  <rect x="420" y="430" width="360" height="58" rx="29" fill="url(#cta)"/>
  <text x="600" y="469" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#ffffff">🍳 60+ recipes · free · no sign-up</text>
</svg>
