<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="apple-touch-icon" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="What Should I Cook? Pick what's in your kitchen and get 3–5 simple recipes you can cook tonight. Free, no sign-up, made for students."
  />
  <meta name="theme-color" content="#c2542a" />
  <meta name="robots" content="index, follow" />
  <title>What Should I Cook? — Dinner ideas from what you already have</title>

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="What Should I Cook?" />
  <meta property="og:title" content="What Should I Cook? — Stop deciding. Start cooking." />
  <meta
    property="og:description"
    content="Pick what's in your kitchen and get 3–5 simple recipes you can cook tonight. Free, no sign-up, made for students."
  />
  <meta property="og:url" content="/" />
  <meta property="og:image" content="/og-cover.svg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="What Should I Cook? — Stop deciding. Start cooking." />
  <meta
    name="twitter:description"
    content="Pick what's in your kitchen and get 3–5 simple recipes you can cook tonight. Free, no sign-up."
  />
  <meta name="twitter:image" content="/og-cover.svg" />

  <!-- Structured data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "What Should I Cook?",
      "description": "Pick what's in your kitchen and get 3–5 simple recipes you can cook tonight.",
      "url": "/"
    }
  </script>

  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem("wsc.theme");
      if (
        t === "dark" ||
        (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      }
    } catch (e) {}
  </script>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
