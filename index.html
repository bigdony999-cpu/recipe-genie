<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="What To Cook" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="What Should I Cook? Pick what's in your kitchen and get 3–5 simple recipes you can cook tonight. Free, no sign-up, made for students."
  />
  <meta name="theme-color" content="#c2542a" />
  <meta name="robots" content="index, follow" />
  <title>What Should I Cook? — Dinner ideas from what you already have</title>

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="What Should I Cook?" />
  <meta property="og:title" content="What Should I Cook? — Stop deciding. Start cooking." />
  <meta
    property="og:description"
    content="Pick what's in your kitchen and get 3–5 simple recipes you can cook tonight. Free, no sign-up, made for students."
  />
  <meta property="og:url" content="/" />
  <meta property="og:image" content="/og-cover.svg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="What Should I Cook? — Stop deciding. Start cooking." />
  <meta
    name="twitter:description"
    content="Pick what's in your kitchen and get 3–5 simple recipes you can cook tonight. Free, no sign-up."
  />
  <meta name="twitter:image" content="/og-cover.svg" />

  <!-- Structured data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "What Should I Cook?",
      "description": "Pick what's in your kitchen and get 3–5 simple recipes you can cook tonight.",
      "url": "/"
    }
  </script>

  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem("wsc.theme");
      if (
        t === "dark" ||
        (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      }
    } catch (e) {}
  </script>

  <!-- Simple Analytics — 100% privacy-first, cookieless site analytics. -->
  <!-- Event queue: buffers sa_event() calls (newsletter signup, ebook clicks)
       even before the main script finishes loading, so goals are never lost. -->
  <script>
    window.sa_event =
      window.sa_event ||
      function () {
        const a = [].slice.call(arguments);
        window.sa_event.q
          ? window.sa_event.q.push(a)
          : (window.sa_event.q = [a]);
      };
  </script>
  <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
  <noscript>
    <img
      src="https://queue.simpleanalytics.com/noscript.gif"
      alt=""
      referrerpolicy="no-referrer-when-downgrade"
    />
  </noscript>
</head>


<body>
  <div id="root"></div>
  <script>
    // Boot watchdog: if the app module fails to load (white screen), show a
    // clear, styled message with the actual error instead of leaving the page
    // blank. Removes itself automatically once React mounts.
    (function () {
      var warned = false;
      var show = function (heading, detail) {
        if (warned) return;
        warned = true;
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML =
          '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fdfaf7;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px">' +
          '<div style="max-width:480px;text-align:center">' +
          '<div style="font-size:40px">🥘</div>' +
          '<h1 style="font-size:18px;font-weight:700;color:#1c1917;margin:12px 0 6px">' + heading + "</h1>" +
          '<p style="font-size:13px;color:#57534e;margin:0 0 14px">' + detail + "</p>" +
          '<button onclick="location.reload()" style="background:#c2542a;color:#fff;border:0;border-radius:9999px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer">Reload</button>' +
          "</div></div>";
      };
      window.addEventListener("error", function (e) {
        show("The app could not start", (e && e.message ? e.message : "Unknown load error") + ". Click Reload to try again.");
      });
      setTimeout(function () {
        var root = document.getElementById("root");
        if (root && root.childElementCount === 0) {
          show("Still loading…", "The app is taking longer than expected to start. Click Reload to try again.");
        }
      }, 8000);
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
