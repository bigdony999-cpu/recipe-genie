  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem("wsc.theme");
      if (
        t === "dark" ||
        (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      }
    } catch (e) {}
  </script>

  <!-- Simple Analytics — 100% privacy-first, cookieless site analytics. -->
  <!-- Event queue: buffers sa_event() calls (newsletter signup, ebook clicks)
       even before the main script finishes loading, so goals are never lost. -->
  <!-- Speed: warm up the analytics connection so the async script loads faster. -->
  <link rel="dns-prefetch" href="https://scripts.simpleanalyticscdn.com" />
  <link rel="preconnect" href="https://scripts.simpleanalyticscdn.com" crossorigin />
  <link rel="dns-prefetch" href="https://queue.simpleanalytics.com" />
  <link rel="preconnect" href="https://queue.simpleanalytics.com" crossorigin />

  <!-- Resolve canonical + og:url to the absolute live URL (domain-agnostic,
       so it follows the site wherever it is deployed). -->
  <script>
    (function () {
      try {
        var canonical = document.querySelector('link[rel="canonical"]');
        if (canonical) canonical.href = window.location.origin + "/";
        var ogUrl = document.querySelector('meta[property="og:url"]');
        if (ogUrl) ogUrl.setAttribute("content", window.location.origin + "/");
      } catch (e) {}
    })();
  </script>

  <script>
    window.sa_event =
      window.sa_event ||
      function () {
        const a = [].slice.call(arguments);
        window.sa_event.q
          ? window.sa_event.q.push(a)
          : (window.sa_event.q = [a]);
      };
  </script>
  <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>

<body>
  <noscript>

      alt=""
      referrerpolicy="no-referrer-when-downgrade"
    />
  </noscript>
  <div id="root"></div>
  <script>
    // Boot watchdog: if the app module fails to load (white screen), show a
    // clear, styled message with the actual error instead of leaving the page
    // blank. Removes itself automatically once React mounts.
    (function () {
      var warned = false;
      var show = function (heading, detail) {
        if (warned) return;
        warned = true;
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML =
          '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fdfaf7;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px">' +
          '<div style="max-width:480px;text-align:center">' +
          '<div style="font-size:40px">🥘</div>' +
          '<h1 style="font-size:18px;font-weight:700;color:#1c1917;margin:12px 0 6px">' + heading + "</h1>" +
          '<p style="font-size:13px;color:#57534e;margin:0 0 14px">' + detail + "</p>" +
          '<button onclick="location.reload()" style="background:#c2542a;color:#fff;border:0;border-radius:9999px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer">Reload</button>' +
          "</div></div>";
      };
      window.addEventListener("error", function (e) {
        show("The app could not start", (e && e.message ? e.message : "Unknown load error") + ". Click Reload to try again.");
      });
      setTimeout(function () {
        var root = document.getElementById("root");
        if (root && root.childElementCount === 0) {
          show("Still loading…", "The app is taking longer than expected to start. Click Reload to try again.");
        }
      }, 8000);
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
